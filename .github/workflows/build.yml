# ============================================================================
# ImmortalWrt GitHub Actions 云编译工作流
# 设备: 磊科 N60 Pro (512MB 闪存 + 2GB 内存 硬改版)
# 布局: 506.5MB UBI (移除 NMBM)
# 源码: padavanonly/immortalwrt-mt798x-6.6
# ============================================================================
name: Build N60 Pro 512M Firmware

on:
  # 纯手动触发, 在 Actions 页面点击 "Run workflow"
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  BASE_CONFIG: defconfig/mt7986-ax6000.config
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Compile Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ===== 第1步: 检出本仓库 =====
      - name: Checkout
        uses: actions/checkout@v5

      # ===== 第2步: 释放磁盘空间 =====
      - name: Free disk space (aggressive)
        run: |
          echo "=== 释放磁盘空间 (深度清理) ==="
          echo "清理前:"
          df -h /

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/google
          sudo rm -rf /opt/az
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo find /opt/hostedtoolcache/Python -mindepth 1 -maxdepth 1 ! -name "3.*" -exec rm -rf {} + 2>/dev/null || true
          sudo rm -rf /opt/microsoft/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/julia
          sudo rm -rf /opt/hostedtoolcache/Kotlin
          docker system prune -af --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /tmp/*
          sudo rm -rf /var/log/*

          echo "清理后:"
          df -h /

      # ===== 第3步: 安装编译依赖 =====
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      # ===== 第4步: 克隆源码 =====
      - name: Clone source code
        run: |
          git clone --depth 1 --single-branch -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          cd openwrt
          git log -1 --format="最新提交: %H%n作者: %an%n日期: %ad%n信息: %s"

      # ===== 第5步: DIY 脚本 (修改源码) =====
      - name: Run DIY script (source modifications)
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/diy-part1.sh
          bash $GITHUB_WORKSPACE/diy-part1.sh

      # ===== 第6步: 更新和安装 feeds =====
      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ===== 第7步: 生成 .config =====
      - name: Generate .config
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/diy-part2.sh
          bash $GITHUB_WORKSPACE/diy-part2.sh

      # ===== 第8步: 下载源码包 =====
      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) V=w 2>&1 | tail -30

      # ===== 第9步: 编译固件 =====
      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=w 2>&1 | tail -200
          echo "=== 固件文件 ==="
          find bin/ -name "*n60*" -type f 2>/dev/null | xargs ls -lh 2>/dev/null || echo "未找到固件"

      # ===== 第10步: 重命名固件并上传到 Releases =====
      - name: Rename and publish to Releases
        if: success()
        run: |
          cd openwrt

          # 获取版本号
          VERSION=$(grep 'VERSION_NUMBER' include/version.mk 2>/dev/null | head -1 | sed 's/.*:= *//' | tr -d '"' | tr -d ' ')
          VERSION=${VERSION:-24.10.0}
          DATE=$(date +%Y%m%d)
          TAG="v${VERSION}-${DATE}"

          echo "版本: ${VERSION}"
          echo "日期: ${DATE}"
          echo "Tag:  ${TAG}"

          # 传递给后续步骤
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_DATE=${DATE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

          # 创建固件输出目录
          mkdir -p /tmp/firmware

          # 查找并重命名固件文件
          FW_DIR="bin/targets/mediatek/filogic"

          # sysupgrade.bin
          SYSUPGRADE=$(find ${FW_DIR} -name "*n60*squashfs-sysupgrade.bin" -type f 2>/dev/null | head -1)
          if [ -n "$SYSUPGRADE" ]; then
            NEW_NAME="immortalwrt-${VERSION}-${DATE}-mediatek-filogic-netcore_n60-pro-506.5MB-squashfs-sysupgrade.bin"
            cp "$SYSUPGRADE" "/tmp/firmware/${NEW_NAME}"
            echo "重命名: ${NEW_NAME}"
          fi

          # factory.bin
          FACTORY=$(find ${FW_DIR} -name "*n60*squashfs-factory.bin" -type f 2>/dev/null | head -1)
          if [ -n "$FACTORY" ]; then
            NEW_NAME="immortalwrt-${VERSION}-${DATE}-mediatek-filogic-netcore_n60-pro-506.5MB-squashfs-factory.bin"
            cp "$FACTORY" "/tmp/firmware/${NEW_NAME}"
            echo "重命名: ${NEW_NAME}"
          fi

          # initramfs-kernel.bin
          INITRAMFS=$(find ${FW_DIR} -name "*n60*initramfs-kernel.bin" -type f 2>/dev/null | head -1)
          if [ -n "$INITRAMFS" ]; then
            NEW_NAME="immortalwrt-${VERSION}-${DATE}-mediatek-filogic-netcore_n60-pro-506.5MB-initramfs-kernel.bin"
            cp "$INITRAMFS" "/tmp/firmware/${NEW_NAME}"
            echo "重命名: ${NEW_NAME}"
          fi

          echo "=== 最终固件列表 ==="
          ls -lh /tmp/firmware/

          # 生成版本信息文件
          cat > /tmp/firmware/build-info.txt << EOF
          ImmortalWrt ${VERSION} 编译信息
          ================================
          编译日期: ${DATE}
          设备: 磊科 N60 Pro (硬改 512MB 闪存 + 2GB 内存)
          布局: 506.5MB UBI (移除 NMBM)
          源码: ${{ env.REPO_URL }} (${{ env.REPO_BRANCH }})
          内核: Linux 6.6
          代理: daed
          组网: EasyTier
          主题: luci-theme-argon
          说明: 精简固件, 日后通过 opkg 安装额外软件
          EOF

      # ===== 第11步: 创建 GitHub Release =====
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ImmortalWrt ${{ env.RELEASE_VERSION }} (${{ env.RELEASE_DATE }}) - N60 Pro 506.5MB
          body: |
            ## ImmortalWrt 固件 - 磊科 N60 Pro

            ### 硬件配置
            - 闪存: 512MB (硬改)
            - 内存: 2GB (硬改)
            - 布局: 506.5MB UBI (移除 NMBM)

            ### 软件配置
            - 代理: daed (eBPF)
            - 组网: EasyTier
            - 主题: luci-theme-argon
            - 精简: 移除 ssr-plus/htop/nano/tcpdump 等无用插件
            - 保留: WiFi/PPPoE/硬件NAT/防火墙/QoS 全部核心功能

            ### 固件说明
            - **sysupgrade.bin**: 升级用, 通过 U-Boot 或 sysupgrade 刷入
            - **factory.bin**: 全新刷入用
            - **initramfs-kernel.bin**: 临时测试用, 不写 Flash

            ### 刷入方法
            1. 断电 → 按住重置按钮 → 通电 → LED 慢闪后松手
            2. 浏览器访问 http://10.10.10.1
            3. 选择 506.5MB 分区表, 上传 sysupgrade.bin
          files: |
            /tmp/firmware/*.bin
            /tmp/firmware/build-info.txt
          draft: false
          prerelease: false

      # ===== 第12步: 清理旧 Release (保留最近3个) =====
      - name: Cleanup old releases
        if: success()
        run: |
          echo "=== 清理旧 Release (保留最近3个) ==="
          # 列出所有 release, 按时间倒序, 删除第4个及之后
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:][] | .tagName' |
          while read -r tag; do
            if [ -n "$tag" ]; then
              echo "删除: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done
          echo "=== 清理完成 ==="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ===== 第13步: 上传编译日志 (失败时) =====
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Build-Logs-Failed
          path: |
            openwrt/.config
            openwrt/tmp/
            openwrt/logs/
          retention-days: 3
          if-no-files-found: warn
