# ============================================================================
#  ImmortalWrt GitHub Actions 云编译工作流
#  设备: 磊科 N60 Pro 硬改版 (512MB NAND / 2GB DDR4 / 506.5MB UBI)
#  触发: 手动 (Actions → Run workflow)
# ============================================================================

name: Build N60 Pro 512M Firmware

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Compile Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # Step 1: 检出本仓库
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # Step 2: 释放磁盘空间
      # ------------------------------------------------------------
      - name: Free disk space
        run: |
          echo "=== 清理前 ===" && df -h /
          START=$(date +%s)

          # 大块头 SDK/运行时
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/az /opt/microsoft/powershell
          sudo rm -rf /usr/local/share/boost

          # hostedtoolcache 里的语言运行时
          sudo rm -rf /opt/hostedtoolcache/{go,Ruby,PyPy,CodeQL,julia,Kotlin}
          sudo find /opt/hostedtoolcache/Python -mindepth 1 -maxdepth 1 ! -name "3.*" -exec rm -rf {} + 2>/dev/null || true

          # Docker 镜像
          docker system prune -af --volumes 2>/dev/null || true

          # apt 缓存 + 临时文件
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/* /tmp/* /var/log/*

          # Node/NVM/Snap
          sudo rm -rf /usr/local/share/npm /usr/local/share/nvm /snap 2>/dev/null || true

          END=$(date +%s)
          echo "=== 清理完成 (耗时 $((END - START)) 秒) ===" && df -h /

      # ------------------------------------------------------------
      # Step 3: 安装编译依赖
      # ------------------------------------------------------------
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            antlr3 autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git gperf intltool libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev libz-dev lld llvm ninja-build \
            patch pkgconf python3 python3-pip python3-ply python3-pyelftools \
            re2c rsync scons subversion swig unzip wget zlib1g-dev zstd
          echo "=== 依赖安装完成 ==="

      # ------------------------------------------------------------
      # Step 4: 克隆固件源码
      # ------------------------------------------------------------
      - name: Clone source
        run: |
          git clone --depth 1 --single-branch -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          cd openwrt
          git log -1 --format="提交: %H%n作者: %an%n日期: %ad%n信息: %s"
          rm -rf .git
          echo "=== 删除 .git 后 ===" && df -h /

      # ------------------------------------------------------------
      # Step 5: DIY Part 1 - 修改源码
      # ------------------------------------------------------------
      - name: Run DIY Part 1
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/diy-part1.sh

      # ------------------------------------------------------------
      # Step 6: 更新和安装 feeds
      # ------------------------------------------------------------
      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          find feeds -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "=== 清理 feeds 后 ===" && df -h /

      # ------------------------------------------------------------
      # Step 7: DIY Part 2 - 生成 .config
      # ------------------------------------------------------------
      - name: Run DIY Part 2
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/diy-part2.sh

      # ------------------------------------------------------------
      # Step 7.5: 上传包列表
      # ------------------------------------------------------------
      - name: Upload package list
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Package-List
          path: |
            openwrt/package-list.txt
            openwrt/.config
          retention-days: 14
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Step 8: 下载源码包
      # ------------------------------------------------------------
      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) V=w 2>&1 | tail -20
          echo "=== 下载完成 ===" && df -h /

      # ------------------------------------------------------------
      # Step 9: 编译固件 (失败时自动诊断)
      # ------------------------------------------------------------
      - name: Build firmware
        id: Build
        run: |
          cd openwrt
          echo "=== 开始编译 ==="
          set +e

          make -j$(nproc) V=w 2>&1 | tee /tmp/build.log | tail -300
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "退出码: ${BUILD_EXIT}"

          if [ ${BUILD_EXIT} -ne 0 ]; then
            echo ""
            echo "=== 编译失败! 诊断中 ==="

            # 搜索错误关键词
            for kw in "error:" "make\[.*Error" "Package.*missing" "No rule to make" \
                     "cannot find" "undefined reference" "fatal:" "No space left"; do
              count=$(grep -ic "$kw" /tmp/build.log 2>/dev/null || echo 0)
              if [ "$count" -gt 0 ]; then
                echo "--- $kw ($count 条) ---"
                grep -in "$kw" /tmp/build.log | tail -10
              fi
            done

            # 检查磁盘空间
            echo "=== 磁盘空间 ===" && df -h /

            # 单线程重编
            if grep -q "target/linux" /tmp/build.log; then
              echo "=== 单线程重编内核 ==="
              make -j1 V=s target/linux/compile 2>&1 | tee /tmp/build-kernel.log | tail -400
              grep -in "error:" /tmp/build-kernel.log | tail -20
            else
              echo "=== 单线程重编软件包 ==="
              make -j1 V=s package/compile 2>&1 | tee /tmp/build-pkg.log | tail -400
              grep -in "error:" /tmp/build-pkg.log | tail -20
            fi

            exit ${BUILD_EXIT}
          fi

          echo "=== 编译成功 ==="
          find bin/ -name "*n60*" -type f 2>/dev/null | xargs ls -lh 2>/dev/null || echo "未找到"

      # ------------------------------------------------------------
      # Step 10: 提取版本号 + 重命名固件
      # ------------------------------------------------------------
      - name: Rename firmware
        if: success()
        run: |
          cd openwrt
          FW_DIR="bin/targets/mediatek/filogic"
          VERSION=""

          echo "=== 提取版本号 ==="

          is_valid_version() {
              echo "$1" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9]+)?$'
          }

          # 方法1: make 展开 version.mk
          v=$(make -s --no-print-directory --eval='include include/version.mk' --eval='v:;@echo $(VERSION_NUMBER)' v 2>/dev/null | tr -d '[:space:][:cntrl:]')
          if is_valid_version "$v"; then VERSION="$v"; echo "  方法1 (make): $VERSION"; fi

          # 方法2: 从固件文件名提取
          if ! is_valid_version "$VERSION"; then
            f=$(find "$FW_DIR" -name "*n60*squashfs-sysupgrade.bin" -type f 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              v=$(basename "$f" | sed -n 's/^immortalwrt-\([^-]*-[^-]*\)-.*/\1/p')
              if is_valid_version "$v"; then VERSION="$v"; echo "  方法2 (文件名): $VERSION"; fi
            fi
          fi

          # 方法3: 默认值兜底
          if ! is_valid_version "$VERSION"; then
            VERSION="24.10-SNAPSHOT"
            echo "  方法3 (默认): $VERSION"
          fi

          echo "  最终版本: ${VERSION}"
          DATE=$(date +%Y%m%d)
          TAG="v${VERSION}-${DATE}"
          echo "Tag: ${TAG}"

          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_DATE=${DATE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

          # 只保留 sysupgrade.bin
          mkdir -p /tmp/firmware
          SYSUPGRADE=$(find "$FW_DIR" -name "*n60*squashfs-sysupgrade.bin" -type f 2>/dev/null | head -1)

          if [ -z "$SYSUPGRADE" ]; then
            echo "[错误] 未找到 sysupgrade.bin!"
            find "$FW_DIR" -name "*.bin" -type f 2>/dev/null
            exit 1
          fi

          NEW_NAME="immortalwrt-${VERSION}-${DATE}-netcore_n60-pro-506.5MB-squashfs-sysupgrade.bin"
          cp "$SYSUPGRADE" "/tmp/firmware/${NEW_NAME}"
          echo "=== 固件文件 ==="
          ls -lh /tmp/firmware/

      # ------------------------------------------------------------
      # Step 11: 发布到 GitHub Releases
      # ------------------------------------------------------------
      - name: Create Release
        if: success() && steps.Build.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ImmortalWrt ${{ env.RELEASE_VERSION }} (${{ env.RELEASE_DATE }}) - N60 Pro 506.5MB
          body: |
            ## ImmortalWrt 固件 - 磊科 N60 Pro 512M

            ### 硬件配置
            - 闪存: 512MB NAND (硬改)
            - 内存: 2GB DDR4 (硬改)
            - 布局: 506.5MB UBI (移除 NMBM)
            - rootfs: 80MB / overlay: ~420MB
            - WiFi 模板: mt7975-ipailna-high-power

            ### 内置插件
            - 代理: daed (eBPF 透明代理)
            - 组网: EasyTier (虚拟局域网)
            - DDNS: ddns-go
            - 共享: Samba4 + CIFS 挂载 + wsdd2
            - 流量: vnstat2 + nlbwmon
            - 主题: luci-theme-argon
            - 工具: ttyd (网页终端)

            ### 系统优化
            - BBR 拥塞控制
            - CPU 频率显示 (mtk-cpufreq)
            - CIFS 自动重连
            - 默认 LAN IP: 10.10.6.1

            ### 默认信息
            - IP: `10.10.6.1`
            - 账号: `root`
            - 密码: 无 (首次登录请设置)
            - ddns-go: `http://10.10.6.1:9800`

            ### 刷入方法
            - 基于U-Bboot2025-WildEdition：`https://www.right.com.cn/forum/thread-8457733-1-1.html`
            - 路由器断电 → 按住重置或Mesh键 → 通电 → 电源LED快闪4次慢闪2次 → 松手
            - 浏览器访问: `http://10.10.10.1`
            - 选 506.5MB 分区表, 上传 sysupgrade.bin
          files: /tmp/firmware/*.bin
          draft: false
          prerelease: false

      # ------------------------------------------------------------
      # Step 12: 清理旧 Release (保留最近 3 个)
      # ------------------------------------------------------------
      - name: Cleanup old releases
        if: success()
        run: |
          echo "=== 清理旧 Release (保留最近 3 个) ==="
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:][] | .tagName' |
          while read -r tag; do
            [ -n "$tag" ] && echo "删除: $tag" && gh release delete "$tag" --yes --cleanup-tag || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Step 13: 失败时上传日志
      # ------------------------------------------------------------
      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Build-Logs-Failed
          path: |
            /tmp/build.log
            /tmp/build-kernel.log
            /tmp/build-pkg.log
            openwrt/.config
          retention-days: 7
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Step 14: 成功时上传固件到 Artifacts (备份)
      # ------------------------------------------------------------
      - name: Upload firmware to Artifacts (backup)
        if: always() && steps.Build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: N60-Pro-512M-Firmware
          path: /tmp/firmware/
          retention-days: 7
          if-no-files-found: warn
