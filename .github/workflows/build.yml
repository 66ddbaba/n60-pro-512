# ============================================================================
#  ImmortalWrt GitHub Actions 云编译工作流
#
#  设备: 磊科 N60 Pro (512MB 闪存 + 2GB 内存 硬改版)
#  布局: 506.5MB UBI (移除 NMBM)
#  源码: padavanonly/immortalwrt-mt798x-6.6
#
#  触发: 纯手动 (workflow_dispatch)
#  输出: GitHub Release (保留最近 3 个) + Artifacts 备份
# ============================================================================
name: Build N60 Pro 512M Firmware

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Compile Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. 检出本仓库 (获取 diy 脚本)
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ============================================================
      # 2. 释放磁盘空间 (删 Android SDK / dotnet 等预装垃圾)
      # ============================================================
      - name: Free disk space
        run: |
          echo "=== 清理前 ===" && df -h /

          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/share/swift
          sudo rm -rf /opt/google /opt/az /opt/microsoft/powershell
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby
          sudo rm -rf /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/julia /opt/hostedtoolcache/Kotlin
          sudo find /opt/hostedtoolcache/Python -mindepth 1 -maxdepth 1 ! -name "3.*" -exec rm -rf {} + 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          sudo apt-get clean && sudo apt-get autoremove -y
          sudo rm -rf /tmp/* /var/log/*

          echo "=== 清理后 ===" && df -h /

      # ============================================================
      # 3. 安装编译依赖
      # ============================================================
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      # ============================================================
      # 4. 克隆 ImmortalWrt 源码
      # ============================================================
      - name: Clone source
        run: |
          git clone --depth 1 --single-branch -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          cd openwrt
          git log -1 --format="提交: %H%n作者: %an%n日期: %ad%n信息: %s"

      # ============================================================
      # 5. DIY Part 1 - 修改源码 (DTS / 设备定义 / 克隆包)
      # ============================================================
      - name: Run DIY Part 1 (source modifications)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/diy-part1.sh

      # ============================================================
      # 6. 更新和安装 feeds
      # ============================================================
      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 7. DIY Part 2 - 生成 .config (精简 + 添加包)
      # ============================================================
      - name: Run DIY Part 2 (generate .config)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/diy-part2.sh

      # ============================================================
      # 8. 下载源码包 (先下载好, 编译时不用等)
      # ============================================================
      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) V=w 2>&1 | tail -20

      # ============================================================
      # 9. 编译固件
      #    - 多线程编译, 失败时自动单线程重编定位错误
      #    - 完整日志保存在 /tmp/build.log
      # ============================================================
      - name: Build firmware
        id: Build
        run: |
          cd openwrt

          echo "=== 开始编译 ==="
          set +e  # 关闭 errexit, 失败后继续执行诊断

          # 多线程编译, 同时保存完整日志
          make -j$(nproc) V=w 2>&1 | tee /tmp/build.log | tail -300
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "退出码: ${BUILD_EXIT}"

          # 失败时: 搜错误 + 单线程重编定位
          if [ ${BUILD_EXIT} -ne 0 ]; then
            echo ""
            echo "=== 编译失败! 搜索错误 ==="
            for kw in "error:" "make\[.*Error" "Package.*missing" "cannot find" "undefined reference" "fatal:"; do
              echo "--- $kw ---"
              grep -in "$kw" /tmp/build.log | tail -15 || true
            done
            echo ""
            echo "=== 磁盘空间 ===" && df -h /
            echo ""
            echo "=== 单线程重编定位 (只编 package) ==="
            make -j1 V=s package/compile 2>&1 | tee /tmp/build-error.log | tail -500
            echo ""
            echo "=== 单线程错误汇总 ==="
            grep -in "error:" /tmp/build-error.log | tail -20 || true
            echo ""
            echo "=== 最后 30 行 ==="
            tail -30 /tmp/build-error.log
            exit ${BUILD_EXIT}
          fi

          echo ""
          echo "=== 编译成功! 固件文件 ==="
          find bin/ -name "*n60*" -type f 2>/dev/null | xargs ls -lh 2>/dev/null || echo "未找到"

      # ============================================================
      # 10. 提取版本号 + 重命名固件
      #     只保留 sysupgrade.bin, 去掉 medatek-filogic
      # ============================================================
      - name: Rename firmware
        if: success()
        run: |
          cd openwrt
          FW_DIR="bin/targets/mediatek/filogic"
          VERSION=""

          echo "=== 提取版本号 ==="

          # 有效版本格式: 24.10.0 / 24.10-SNAPSHOT / 24.10
          is_valid_version() {
              echo "$1" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9]+)?$'
          }

          # 方法1: 从 .config 提取 CONFIG_VERSION_NUMBER
          if [ -f .config ]; then
            v=$(grep -m1 '^CONFIG_VERSION_NUMBER=' .config 2>/dev/null | sed 's/^CONFIG_VERSION_NUMBER=//; s/"//g; s/[[:space:]]//g')
            if is_valid_version "$v"; then VERSION="$v"; echo "  方法1 (.config): $VERSION"; fi
          fi

          # 方法2: 用 make 展开 version.mk 的变量
          if ! is_valid_version "$VERSION"; then
            v=$(make -s --no-print-directory --eval='include include/version.mk' --eval='v:;@echo $(VERSION_NUMBER)' v 2>/dev/null | tr -d '[:space:][:cntrl:]')
            if is_valid_version "$v"; then VERSION="$v"; echo "  方法2 (make): $VERSION"; fi
          fi

          # 方法3: 从固件文件名提取
          if ! is_valid_version "$VERSION"; then
            f=$(find "$FW_DIR" -name "*n60*squashfs-sysupgrade.bin" -type f 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              v=$(basename "$f" | sed -n 's/^immortalwrt-\([^-]*-[^-]*\)-.*/\1/p')
              if is_valid_version "$v"; then VERSION="$v"; echo "  方法3 (文件名): $VERSION"; fi
            fi
          fi

          # 方法4: 默认值兜底
          if ! is_valid_version "$VERSION"; then
            VERSION="24.10-SNAPSHOT"
            echo "  方法4 (默认): $VERSION"
          fi

          echo "  最终版本: ${VERSION}"

          # 日期和 tag
          DATE=$(date +%Y%m%d)
          TAG="v${VERSION}-${DATE}"
          echo "Tag: ${TAG}"

          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_DATE=${DATE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

          # --- 只复制 sysupgrade.bin 并重命名 (去掉 medatek-filogic) ---
          mkdir -p /tmp/firmware
          SYSUPGRADE=$(find "$FW_DIR" -name "*n60*squashfs-sysupgrade.bin" -type f 2>/dev/null | head -1)

          if [ -z "$SYSUPGRADE" ]; then
            echo "[错误] 未找到 sysupgrade.bin!"
            find "$FW_DIR" -name "*.bin" -type f 2>/dev/null
            exit 1
          fi

          NEW_NAME="immortalwrt-${VERSION}-${DATE}-netcore_n60-pro-506.5MB-squashfs-sysupgrade.bin"
          cp "$SYSUPGRADE" "/tmp/firmware/${NEW_NAME}"
          echo ""
          echo "=== 固件 ==="
          ls -lh /tmp/firmware/

      # ============================================================
      # 11. 发布到 GitHub Releases
      # ============================================================
      - name: Create Release
        if: success() && steps.Build.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ImmortalWrt ${{ env.RELEASE_VERSION }} (${{ env.RELEASE_DATE }}) - N60 Pro 506.5MB
          body: |
            ## ImmortalWrt 固件 - 磊科 N60 Pro

            ### 登录信息
            - 管理地址: **http://10.10.6.1**
            - 默认账号: `root`
            - 默认密码: **无** (首次登录请直接点登录, 然后设置密码)

            ### 硬件
            - 闪存: 512MB (硬改)
            - 内存: 2GB (硬改)
            - 布局: 506.5MB UBI (移除 NMBM)
            - rootfs: 80MB / rootfs_data: ~420MB
            - 模板: mt7975-ipailna-high-power (237高功率版)

            ### 内置插件
            - 代理: daed (eBPF)
            - 组网: EasyTier
            - DDNS: ddns-go (自动最新版)
            - 共享: Samba4 + CIFS 挂载
            - 流量: vnstat2 (WAN) + nlbwmon (内网设备)
            - 主题: luci-theme-argon
            - 工具: ttyd (网页终端,免登录) + minidlna (DLNA) + irqbalance + autocore

            ### 系统优化 (uci-defaults 自动执行)
            - 拥塞控制: BBR (替代默认 CUBIC)
            - Samba4: 多通道 + 访客访问
            - ttyd: 免登录 (仅限 LAN 口)
            - 默认 IP: 10.10.6.1

            ### 精简项
            - 移除 ssr-plus (daed 替代)
            - 移除 wrtbwmon + statistics (vnstat2+nlbwmon 替代)
            - 移除 diag-core (命令行仍可用)
            - 移除 argon-config (主题用默认即可)
            - 移除 bootstrap-mod (argon 替代)
            - 移除调试工具 / IPv6 用户态 / zram / ebtables 等

            ### 刷入方法
            1. 断电 → 按住重置或Mesh键 → 通电 → 电源LED慢闪4次快闪2次 → 松手
            2. 浏览器访问 http://10.10.10.1
            3. 选 506.5MB 分区表, 上传 sysupgrade.bin
          files: /tmp/firmware/*.bin
          draft: false
          prerelease: false

      # ============================================================
      # 12. 清理旧 Release (保留最近 3 个)
      # ============================================================
      - name: Cleanup old releases
        if: success()
        run: |
          echo "=== 清理旧 Release (保留最近3个) ==="
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:][] | .tagName' |
          while read -r tag; do
            [ -n "$tag" ] && echo "删除: $tag" && gh release delete "$tag" --yes --cleanup-tag || true
          done
          echo "=== 完成 ==="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 13. 失败时上传日志
      # ============================================================
      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Build-Logs-Failed
          path: |
            /tmp/build.log
            /tmp/build-error.log
            openwrt/.config
          retention-days: 7
          if-no-files-found: warn

      # ============================================================
      # 14. 成功时也上传到 Artifacts (备份)
      # ============================================================
      - name: Upload firmware to Artifacts (backup)
        if: always() && steps.Build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: N60-Pro-512M-Firmware
          path: /tmp/firmware/
          retention-days: 7
          if-no-files-found: warn
