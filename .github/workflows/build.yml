# ============================================================================
#  ImmortalWrt GitHub Actions 云编译工作流
#
#  设备: 磊科 N60 Pro (512MB 闪存 + 2GB 内存 硬改版)
#  布局: 506.5MB UBI (移除 NMBM)
#  源码: padavanonly/immortalwrt-mt798x-6.6
#
#  触发: 纯手动 (workflow_dispatch)
#  输出: GitHub Release (保留最近 3 个) + Artifacts 备份
# ============================================================================
name: Build N60 Pro 512M Firmware

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Compile Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. 检出本仓库 (获取 diy 脚本)
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ============================================================
      # 2. 释放磁盘空间
      # ============================================================
      - name: Free disk space
        run: |
          echo "=== 清理前 ===" && df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/share/swift
          sudo rm -rf /opt/google /opt/az /opt/microsoft/powershell
          sudo rm -rf /opt/hostedtoolcache/{go,Ruby,PyPy,CodeQL,julia,Kotlin}
          sudo find /opt/hostedtoolcache/Python -mindepth 1 -maxdepth 1 ! -name "3.*" -exec rm -rf {} + 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          sudo apt-get clean && sudo apt-get autoremove -y
          sudo rm -rf /tmp/* /var/log/* /var/cache/apt/*
          sudo apt-get remove -y firefox '*cpp*' '*fortran*' '*objc*' 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo rm -rf /usr/local/share/npm /snap /usr/local/share/nvm 2>/dev/null || true
          echo "=== 清理后 ===" && df -h /

      # ============================================================
      # 3. 安装编译依赖
      # ============================================================
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      # ============================================================
      # 4. 克隆源码 + 删 .git 省空间
      # ============================================================
      - name: Clone source
        run: |
          git clone --depth 1 --single-branch -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          cd openwrt
          git log -1 --format="提交: %H%n作者: %an%n日期: %ad%n信息: %s"
          rm -rf .git
          echo "=== 删 .git 后 ===" && df -h /

      # ============================================================
      # 5. DIY Part 1 - 修改源码 (DTS / 设备定义 / 克隆包 / ddns-go / uci-defaults)
      # ============================================================
      - name: Run DIY Part 1
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/diy-part1.sh

      # ============================================================
      # 6. 更新和安装 feeds + 删 .git
      # ============================================================
      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          find feeds -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "=== 清理 feeds 后 ===" && df -h /

      # ============================================================
      # 7. DIY Part 2 - 生成 .config (精简 + 添加包)
      # ============================================================
      - name: Run DIY Part 2
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/diy-part2.sh

      # ============================================================
      # 8. 下载源码包 + 清理大 tar
      # ============================================================
      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) V=w 2>&1 | tail -20
          find dl/ -type f \( -name "*.tar.gz" -o -name "*.tar.xz" -o -name "*.tar.bz2" -o -name "*.zip" -o -name "*.tar.zst" \) -size +5M -exec rm -f {} + 2>/dev/null || true
          echo "=== 清理 dl/ 后 ===" && df -h /

      # ============================================================
      # 9. 编译固件 (失败时自动诊断)
      # ============================================================
      - name: Build firmware
        id: Build
        run: |
          cd openwrt
          echo "=== 开始编译 ==="
          set +e

          make -j$(nproc) V=w 2>&1 | tee /tmp/build.log | tail -300
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "退出码: ${BUILD_EXIT}"

          if [ ${BUILD_EXIT} -ne 0 ]; then
            echo ""
            echo "=== 编译失败! 诊断中 ==="

            # 1. 搜错误关键词
            for kw in "error:" "make\[.*Error" "Package.*missing" "No rule to make" \
                     "cannot find" "undefined reference" "fatal:" "No space left"; do
              count=$(grep -ic "$kw" /tmp/build.log 2>/dev/null || echo 0)
              if [ "$count" -gt 0 ]; then
                echo "--- $kw ($count 条) ---"
                grep -in "$kw" /tmp/build.log | tail -10
              fi
            done

            # 2. 磁盘空间
            echo "=== 磁盘空间 ===" && df -h /

            # 3. 判断失败阶段并单线程重编
            if grep -q "target/linux" /tmp/build.log; then
              echo "=== 单线程重编内核 ==="
              make -j1 V=s target/linux/compile 2>&1 | tee /tmp/build-kernel.log | tail -400
              grep -in "error:" /tmp/build-kernel.log | tail -20
            else
              echo "=== 单线程重编包 ==="
              make -j1 V=s package/compile 2>&1 | tee /tmp/build-pkg.log | tail -400
              grep -in "error:" /tmp/build-pkg.log | tail -20
            fi

            exit ${BUILD_EXIT}
          fi

          echo "=== 编译成功 ==="
          find bin/ -name "*n60*" -type f 2>/dev/null | xargs ls -lh 2>/dev/null || echo "未找到"

      # ============================================================
      # 10. 提取版本号 + 重命名固件
      # ============================================================
      - name: Rename firmware
        if: success()
        run: |
          cd openwrt
          FW_DIR="bin/targets/mediatek/filogic"
          VERSION=""

          echo "=== 提取版本号 ==="

          is_valid_version() {
              echo "$1" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9]+)?$'
          }

          # 方法1: 用 make 展开 version.mk (能正确处理 $(call qstrip,...))
          v=$(make -s --no-print-directory --eval='include include/version.mk' --eval='v:;@echo $(VERSION_NUMBER)' v 2>/dev/null | tr -d '[:space:][:cntrl:]')
          if is_valid_version "$v"; then VERSION="$v"; echo "  方法1 (make): $VERSION"; fi

          # 方法2: 从固件文件名提取
          if ! is_valid_version "$VERSION"; then
            f=$(find "$FW_DIR" -name "*n60*squashfs-sysupgrade.bin" -type f 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              v=$(basename "$f" | sed -n 's/^immortalwrt-\([^-]*-[^-]*\)-.*/\1/p')
              if is_valid_version "$v"; then VERSION="$v"; echo "  方法2 (文件名): $VERSION"; fi
            fi
          fi

          # 方法3: 默认值
          if ! is_valid_version "$VERSION"; then
            VERSION="24.10-SNAPSHOT"
            echo "  方法3 (默认): $VERSION"
          fi

          echo "  最终版本: ${VERSION}"
          DATE=$(date +%Y%m%d)
          TAG="v${VERSION}-${DATE}"
          echo "Tag: ${TAG}"

          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_DATE=${DATE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

          # 复制 sysupgrade.bin 并重命名
          mkdir -p /tmp/firmware
          SYSUPGRADE=$(find "$FW_DIR" -name "*n60*squashfs-sysupgrade.bin" -type f 2>/dev/null | head -1)

          if [ -z "$SYSUPGRADE" ]; then
            echo "[错误] 未找到 sysupgrade.bin!"
            find "$FW_DIR" -name "*.bin" -type f 2>/dev/null
            exit 1
          fi

          NEW_NAME="immortalwrt-${VERSION}-${DATE}-netcore_n60-pro-506.5MB-squashfs-sysupgrade.bin"
          cp "$SYSUPGRADE" "/tmp/firmware/${NEW_NAME}"
          echo "=== 固件 ==="
          ls -lh /tmp/firmware/

      # ============================================================
      # 11. 发布到 GitHub Releases
      # ============================================================
      - name: Create Release
        if: success() && steps.Build.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ImmortalWrt ${{ env.RELEASE_VERSION }} (${{ env.RELEASE_DATE }}) - N60 Pro 506.5MB
          body: |
            ## ImmortalWrt 固件 - 磊科 N60 Pro

            ### 硬件
            - 闪存: 512MB (硬改)
            - 内存: 2GB (硬改)
            - 布局: 506.5MB UBI (移除 NMBM)
            - rootfs: 80MB / rootfs_data: ~420MB
            - 模板: mt7975-ipailna-high-power (237高功率版)

            ### 内置插件
            - 代理: daed (eBPF)
            - 组网: EasyTier
            - DDNS: ddns-go (自动最新版)
            - 共享: Samba4 + CIFS 挂载
            - 流量: vnstat2 (WAN) + nlbwmon (内网设备)
            - 主题: luci-theme-argon
            - 工具: ttyd (网页终端,免登录) + autocore

            ### 精简项
            - 移除 ssr-plus / wrtbwmon / diag-core / argon-config
            - 移除调试工具 / IPv6 用户态 / zram / ebtables 等

            ### 刷入方法
            1. 断电 → 按住重置或Mesh键 → 通电 → 电源LED快闪4次慢闪2次（U-Bboot2025-WildEdition） → 松手
            2. 浏览器访问 http://10.10.10.1
            3. 选 506.5MB 分区表, 上传 sysupgrade.bin
          files: /tmp/firmware/*.bin
          draft: false
          prerelease: false

      # ============================================================
      # 12. 清理旧 Release (保留最近 3 个)
      # ============================================================
      - name: Cleanup old releases
        if: success()
        run: |
          echo "=== 清理旧 Release (保留最近3个) ==="
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:][] | .tagName' |
          while read -r tag; do
            [ -n "$tag" ] && echo "删除: $tag" && gh release delete "$tag" --yes --cleanup-tag || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 13. 失败时上传日志
      # ============================================================
      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Build-Logs-Failed
          path: |
            /tmp/build.log
            /tmp/build-kernel.log
            /tmp/build-pkg.log
            openwrt/.config
          retention-days: 7
          if-no-files-found: warn

      # ============================================================
      # 14. 成功时上传到 Artifacts (备份)
      # ============================================================
      - name: Upload firmware to Artifacts (backup)
        if: always() && steps.Build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: N60-Pro-512M-Firmware
          path: /tmp/firmware/
          retention-days: 7
          if-no-files-found: warn
